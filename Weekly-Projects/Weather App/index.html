<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API-Based Weather APP</title>
    <link rel="stylesheet" href="index.css">

    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <script src="index.js" defer></script>
</head>
<body>
    <!-- Mini Project - API - based Weather App -->
    <div class="card">
        <div class="search-box">
            <input type="text" id="city-input" placeholder="Enter City Name.."
            autocomplete="off">
            <button id="search-btn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>

        <!-- Error Message -->
         <div id="error-msg" class="error-msg hidden">
            <p class="fa-solid fa-triangle-exlamation"><i>Invalid city name. Please try again.</i></p>
         </div>

         <!-- Loding Spinner -->
        <div id="loader" class="loader hidden"></div>
        
        <!-- weather Display Container -->
         <div id="weather-info" class="weather-info hidden">
            <h2 id="city-name">---</h2>
            <p id="date-time" class="date-time">---</p>

            <div class="weather-main">
                <img src="" alt="Weather icon" id="weather-icon">
                <h1 id="temp">--°C</h1>
            </div>
            <p id="weather-condition" class="condition">---</p>

            <!-- Additional Details -->
             <div class="details">
                <div class="col">
                    <i class="fa-solid fa-water"></i>
                    <div>
                        <p id="humidity">--%</p>
                        <span>Humidity</span>
                    </div>
                </div>
                <div class="col">
                    <id class="fa-solid fa-wind"></id>
                    <div>
                        <p id="wind-speed">-- km</p>
                        <span>Wind Speed</span>
                    </div>
                </div>
             </div>
         </div>
    </div>
</body>
</html>
