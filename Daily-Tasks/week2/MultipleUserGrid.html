<!-- Task 2 - Multiple Users Grid -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Multiple Users Grid</title>
    <style>
        *{
            box-sizing: border-box;
            padding: 0;
            margin: 0;
        }
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 50px 22px;
        }
        h1{
            color: #1f2937;
            margin-bottom: 20px;
        }
        .btn{
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 14px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-bottom: 30px;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }
        .btn:hover{
            background-color: #4338ca;
        }
        .btn:active{
            transform: scale(0.98);
        }
        .btn:disabled{
            background-color: #9ca3af;
            cursor: not-allowed;
        }
        .user-grid{
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            width: 100%;
            max-width: 1200px;
        }
        .card{
            background: #fff;
            padding: 25px 20px;
            border-radius: 14px;
            box-shadow: 4px 15px rgba(0, 0, 0, 0.00);
            text-align: center;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .card:hover{
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.12);
        }
        .profile-img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #4f46e5;
      margin-bottom: 15px;
    }

    .full-name {
      font-size: 1.15rem;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 8px;
    }

    .email {
      font-size: 0.85rem;
      color: #6b7280;
      word-break: break-all;
    }

    .status-text {
      font-size: 1.1rem;
      color: #6b7280;
      grid-column: 1 / -1;
      text-align: center;
    }
    </style>
</head>
<body>
    <h1>User Directory</h1>
    <button id="fetchBtn" class="btn">Fetch New Users</button>
    <div id="userGrid" class="user-grid">

    </div>
    <script>
        const userGrid = document.getElementById('userGrid');
        const fetchBtn = document.getElementById('fetchBtn');
        async function fetchMultipleUsers() {
            try {
            // Clear current content and show loading state
            userGrid.innerHTML = '<p class="status-text">Loading users...</p>';
            fetchBtn.disabled = true;

            // API call to fetch 5 users
            const response = await fetch('https://randomuser.me/api/?results=5');
            const data = await response.json();
            const users = data.results;

            // Clear loading text
            userGrid.innerHTML = '';

            // Loop through each user and create dynamic DOM elements
            users.forEach(user => {
            const userCard = document.createElement('div');
            userCard.classList.add('card');

            userCard.innerHTML = `
                <img class="profile-img" src="${user.picture.large}" alt="${user.name.first}">
                <h2 class="full-name">${user.name.first} ${user.name.last}</h2>
                <p class="email">${user.email}</p>
            `;

            userGrid.appendChild(userCard);
            });

            } catch (error) {
            console.error('Error fetching users:', error);
            userGrid.innerHTML = '<p class="status-text" style="color: #ef4444;">Failed to load users. Please try again.</p>';
            } finally {
            fetchBtn.disabled = false;
            }
        }

    
        fetchBtn.addEventListener('click', fetchMultipleUsers);
        window.addEventListener('DOMContentLoaded', fetchMultipleUsers);
    </script>
</body>
</html>
