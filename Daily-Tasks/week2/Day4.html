<!-- Task 1 – Random User Card -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random User Card</title>
    <style>
        body{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e6ede9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card-container{
            background: #fff;
            padding: 60px;
            border-radius: 25px;
            box-shadow: 8px 19px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        .profile-img{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4f46e5;
            margin-bottom: 15px;
        }
        .full-name{
            font-size: 0.9rem;
            font-weight: 600;
            color: #1f2937;
            margin: 10px 0 5px 0;
        }
        .email{
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 20px;
            word-break: break-all;
        }
        .btn{
            background-color: #4f46e5;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn:hover{
            background-color: #4338ca;
        }
        .loding{
            color: #9ca3af;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card-container">
        <img id="profileImage" class="profile-img" src="" alt="Profile Picture">
        <h2 id="fullName" class="full-name">Loading...</h2>
        <p id="email" class="email">Loading...</p>
        <button id="fetchBtn" class="btn">Get New User</button>
    </div>
    <script>
    const profileImage = document.getElementById('profileImage');
    const fullName = document.getElementById('fullName');
    const email = document.getElementById('email');
    const fetchBtn = document.getElementById('fetchBtn');

    async function fetchRandomUser() {
      try {
        // Show loading state
        fullName.textContent = "Loading...";
        email.textContent = "";
        fetchBtn.disabled = true;

        const response = await fetch('https://randomuser.me/api/');
        const data = await response.json();
        const user = data.results[0];

        // Extract required fields
        const pictureUrl = user.picture.large;
        const name = `${user.name.first} ${user.name.last}`;
        const userEmail = user.email;

        // Update DOM elements
        profileImage.src = pictureUrl;
        fullName.textContent = name;
        email.textContent = userEmail;
      } catch (error) {
        console.error('Error fetching user:', error);
        fullName.textContent = "Failed to load";
        email.textContent = "Please try again later.";
      } finally {
        fetchBtn.disabled = false;
      }
    }

    // Event Listener for the button
    fetchBtn.addEventListener('click', fetchRandomUser);

    // Fetch initial user on page load
    window.addEventListener('DOMContentLoaded', fetchRandomUser);
  </script>
</body>
</html>
