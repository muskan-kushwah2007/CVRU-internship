<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Validation</title>
    <link rel="stylesheet" href="Formv.css">
    <script src="Formv.js" defer></script>
</head>
<body>
    <div class="form-container">
    <h2>User Registration Form</h2>
    
    <form id="registrationForm">
      
      <!-- 1. Full Name Field -->
      <div class="form-group">
        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" placeholder="Enter your full name">
        <small class="error-msg" id="nameError"></small>
      </div>

      <!-- 2. Email Field -->
      <div class="form-group">
        <label for="email">Email Address:</label>
        <input type="email" id="email" placeholder="Enter your email">
        <small class="error-msg" id="emailError"></small>
      </div>

      <!-- 3. Password Field -->
      <div class="form-group">
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter password">
        <small class="error-msg" id="passError"></small>
      </div>

      <!-- 4. Age Field -->
      <div class="form-group">
        <label for="age">Age:</label>
        <input type="number" id="age" placeholder="Enter your age">
        <small class="error-msg" id="ageError"></small>
      </div>

      <!-- 5. City Dropdown Select -->
      <div class="form-group">
        <label for="city">Select City:</label>
        <select id="city">
          <option value="">-- Select Your City --</option>
          <option value="Delhi">Delhi</option>
          <option value="Mumbai">Mumbai</option>
          <option value="Bangalore">Bangalore</option>
        </select>
        <small class="error-msg" id="cityError"></small>
      </div>

      <!-- 6. Gender Radio Buttons -->
      <div class="form-group">
        <label>Gender:</label>
        <div class="radio-group">
          <label><input type="radio" name="gender" value="Male"> Male</label>
          <label><input type="radio" name="gender" value="Female"> Female</label>
        </div>
        <small class="error-msg" id="genderError"></small>
      </div>

      <!-- 7. Address Textarea -->
      <div class="form-group">
        <label for="address">Address:</label>
        <textarea id="address" rows="3" placeholder="Enter your full address"></textarea>
        <small class="error-msg" id="addressError"></small>
      </div>

      <!-- 8. Terms Checkbox -->
      <div class="form-group checkbox-group">
        <label>
          <input type="checkbox" id="terms"> I agree to the terms & conditions
        </label>
        <small class="error-msg" id="termsError"></small>
      </div>

      <!-- 9. Form Buttons Container -->
      <div class="form-group button-group">
        <button type="submit" id="submitBtn">Submit</button>
        <button type="reset" id="resetBtn">Reset</button>
      </div>

    </form>
  </div>
</body>
</html>
